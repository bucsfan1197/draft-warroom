name: refresh-data

# Rebuilds data.js from the live sources every 6h AND publishes the site in the same run.
# Publishing has to happen here because GitHub will NOT let a push made by this workflow's token
# trigger the separate publish workflow — so if the refresh only pushed data, the live site would
# never redeploy (which is exactly what happened: repo fresh, live site frozen). Deploying inline
# fixes it. Free: public repos get unlimited Actions minutes.

on:
  schedule:
    - cron: '0 */6 * * *'   # 00:00 / 06:00 / 12:00 / 18:00 UTC
  workflow_dispatch: {}       # run on demand from the Actions tab

permissions:
  contents: write   # push the rebuilt data.js + proj_archive.csv
  pages: write      # publish to GitHub Pages
  id-token: write   # required by deploy-pages

# Share the 'pages' group so a refresh deploy and a hand-push deploy (pages.yml) never overlap.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so proj_archive.csv appends cleanly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Identify the committer
        run: |
          git config user.name  "warroom-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Rebuild data and push
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional: enables the player-props forward-experiment
        run: python refresh.py --once

      # Publish the freshly-rebuilt site in this same run (the token's own push can't trigger pages.yml).
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
